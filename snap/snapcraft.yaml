name: ubuntu-core-manager
base: core24
version: '1.0.0'
summary: A GUI frontend to manage Ubuntu Core devices
title: Manage your Ubuntu core device
description: |
  A GUI that puts you in the driver seat of your Ubuntu Core device

  Manage all aspects of Ubuntu Core through this GUI app running on
  top of ubuntu-frame on your Ubuntu Core device.

  Ubuntu Core manager gives every known snapd command a graphical
  option, refresh, revert or hold your snaps with a single mouse click.

  Configure snap settings and manage services in snaps easily.

  Set the update schedule for your device or switch to completely manual
  updates as you like.

  Connect and disconnect interfaces, manage running processes, set time
  and time zone as well as the keymap layout and watch the system journal.

  Manage network interfaces, proxies, network time sync and ip forwarding rules
  through the network page and embed local web UIs of snap packages directly
  in the app.

contact: https://github.com/ogra1/ubuntu-core-manager/issues
license: Apache-2.0
issues: https://github.com/ogra1/ubuntu-core-manager/issues
source-code: https://github.com/ogra1/ubuntu-core-manager
website: https://github.com/ogra1/ubuntu-core-manager

confinement: strict
grade: stable

apps:
  manager:
    command-chain:
      - bin/wayland-launch
    command: bin/launcher
    daemon: simple
    extensions: [ gpu ]
    plugs:
      - log-observe
      - mount-observe
      - network
      - network-bind
      - network-control
      - network-setup-control
      - opengl
      - process-control
      - shutdown
      - snapd-control
      - system-observe
      - time-control
      - timeserver-control
      - wayland
    environment:
      LIBGL_DRIVERS_PATH: $SNAP/gpu-2404/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri
      XDG_DATA_HOME: $SNAP_USER_DATA
      XDG_DATA_DIRS: $SNAP/usr/share:$SNAP/gpu-2404/usr/share
      GTK_USE_PORTAL: 0
      GDK_GL: gles

environment:
  # Other, generally useful environment settings...
  # XDG config
  XDG_CACHE_HOME:  $SNAP_USER_COMMON/.cache
  XDG_CONFIG_HOME: $SNAP_USER_DATA/.config
  XDG_CONFIG_DIRS: $SNAP/etc/xdg
  XDG_DATA_DIRS:   $SNAP/usr/local/share:$SNAP/usr/share
  # XKB config
  XKB_CONFIG_ROOT: $SNAP/usr/share/X11/xkb

# The `layout` ensures that files can be found by applications where they are expected by the toolkit or application.
layout:
  # Other, generally useful paths
  /usr/share/fonts:
    bind: $SNAP/usr/share/fonts
  /usr/share/icons:
    bind: $SNAP/usr/share/icons
  /usr/share/sounds:
    bind: $SNAP/usr/share/sounds
  /etc/fonts:
    bind: $SNAP/etc/fonts
  # GTK
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0
  /usr/libexec/glycin-loaders:
    bind: $SNAP/usr/libexec/glycin-loaders
  /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gtk-3.0:
    bind: $SNAP/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gtk-3.0
  /usr/share/mime:
    bind: $SNAP/usr/share/mime
  /etc/gtk-3.0:
    bind: $SNAP/etc/gtk-3.0

lint:
  ignore:
    - library:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libcolordprivate.so.2.0.5
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdconf.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libfreebl3.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libfreeblpriv3.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libnssckbi.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libnssdbm3.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libsoftokn3.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libssl3.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdconf.so.1.0.0
    - gpu:
      - electron/libvulkan.so.1

parts:
  app:
    plugin: dump
    source: .
    override-build: |
      set -ex
      # Drop build-only cruft so it never reaches stage/prime. (The source
      # node_modules is the dev tree — puppeteer + a full electron install are
      # NOT what the snap needs; the electron part provides the binary.)
      rm -rf node_modules test snap package-lock.json build/css/*.css.map
      mkdir -p "$CRAFT_PART_INSTALL/app" "$CRAFT_PART_INSTALL/bin"
      cp -r main.js preload.js package.json ui build "$CRAFT_PART_INSTALL/app/"
      # Ship the runtime D-Bus dependency (main.js lazy-requires dbus-next for
      # the timeserver-control interface). Install ONLY that package (production,
      # no dev/electron) into a scratch project and copy the resulting
      # node_modules tree into the app dir, so it resolves under $SNAP/app.
      SCRATCH=$(mktemp -d)
      cd "$SCRATCH"
      npm init -y >/dev/null
      npm install --omit=dev --no-audit --no-fund "dbus-next@^0.10.2"
      mkdir -p "$CRAFT_PART_INSTALL/app/node_modules"
      cp -a node_modules/. "$CRAFT_PART_INSTALL/app/node_modules/"
      rm -rf "$SCRATCH"
      cd -
      cat > "$CRAFT_PART_INSTALL/bin/launcher" <<'LAUNCHER'
      #!/bin/sh
      # Launch the Electron main process from the read-only snap home.
      # --no-sandbox is required under strict confinement (no user namespaces).
      # --user-data-dir keeps Chromium's writable profile in the writable
      # $SNAP_COMMON (the snap home is read-only).
      EXTRA_ARGS=""
      if [ ! -e /dev/dri/renderD128 ]; then
        EXTRA_ARGS="--use-gl=angle --use-angle=swiftshader"
      fi

      exec "$SNAP"/electron/electron \
           --enable-features=UseOzonePlatform \
           --ozone-platform=wayland \
           --disable-dev-shm-usage \
           --no-sandbox \
           $EXTRA_ARGS \
           --user-data-dir="$SNAP_COMMON/electron" \
           "$SNAP"/app/main.js
      LAUNCHER
      chmod +x "$CRAFT_PART_INSTALL/bin/launcher"
    stage-packages:
      - iw 

  electron:
    plugin: nil
    build-packages:
      - nodejs
      - npm
    override-build: |
      set -ex
      EL_VER=31.7.7
      SCRATCH=$(mktemp -d)
      cd "$SCRATCH"
      npm init -y >/dev/null
      # Postinstall fetches the official prebuilt binary for this platform.
      # (If your build env blocks GitHub, pre-stage node_modules/electron/dist
      #  here or point @electron/get at a mirror via ELECTRON_MIRROR.)
      npm install --no-audit --no-fund "electron@${EL_VER}"
      mkdir -p "$CRAFT_PART_INSTALL/electron"
      cp -a node_modules/electron/dist/. "$CRAFT_PART_INSTALL/electron/"
      rm -rf "$SCRATCH"
    stage-packages:
      - libnspr4
      - libnss3
      - libatk-bridge2.0-0
      - libcups2
      - libgtk-3-0
      - libasound2t64
      - xkb-data

  gsettings+pixbuf+immodules:
    plugin: nil
    build-packages:
      - libgdk-pixbuf2.0-0
      - librsvg2-common
      - shared-mime-info
      - libgtk-3-0
    override-build: |
      craftctl default
      # Update mime database
      update-mime-database ${CRAFT_PART_INSTALL}/usr/share/mime
      # build immodules cache
      mkdir -p ${CRAFT_PART_INSTALL}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gtk-3.0/3.0.0/
      /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/libgtk-3-0t64/gtk-query-immodules-3.0 > ${CRAFT_PART_INSTALL}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gtk-3.0/3.0.0/immodules.cache
    stage-packages:
      - librsvg2-common
      - gsettings-desktop-schemas
      - libglib2.0-bin
    override-prime: |
      craftctl default
      # Compile the gsettings schemas
      /usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/glib-2.0/glib-compile-schemas "$CRAFT_PRIME/usr/share/glib-2.0/schemas"
      # Index the pixbuf loaders
      LOADERS_PATH=$(echo ${CRAFT_PRIME}/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_FOR}/gdk-pixbuf-2.0/*/loaders)
      QUERY_LOADERS=/usr/lib/${CRAFT_ARCH_TRIPLET_BUILD_ON}/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders
      GDK_PIXBUF_MODULEDIR=${LOADERS_PATH} ${QUERY_LOADERS} > ${LOADERS_PATH}/../loaders.cache
      sed s!$CRAFT_PRIME!!g --in-place ${LOADERS_PATH}/../loaders.cache

  setup:
    plugin: dump
    source: wayland-launch
    override-build: |
      # The plugs needed to run Wayland. (wayland-launch checks them, setup.sh connects them)
      # You may add further plugs here if you want these options
      #PLUGS="opengl wayland gpu-2404 browser-support network network-bind"
      PLUGS="opengl wayland gpu-2404 network network-bind"
      sed --in-place "s/%PLUGS%/$PLUGS/g" $CRAFT_PART_BUILD/bin/wayland-launch
      craftctl default
    stage-packages:
      - inotify-tools

  cleanup:
    after:
      - app
      - electron
      - gsettings+pixbuf+immodules
      - setup
    plugin: nil
    override-prime: |
      craftctl default
      cd "$CRAFT_PRIME/usr/share/"
      rm -rf applications apport bash-completion dbus-1 doc-base doc gtk-doc\
             help linitan pkgconfig libthai man metainfo themes thumbnailers xml
